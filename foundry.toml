[profile.default]
src = "src"
test = "test"
script = "script"
out = "out"
libs = ["lib"]
fs_permissions = [{ access = "read", path = "./examples" }]
solc_version = "0.8.29"
optimizer = true
optimizer_runs = 200
bytecode_hash = "none"
remappings = [
  "@reactive/=lib/reactive-lib-omni/",
  "forge-std/=lib/reactive-lib-omni/lib/forge-std/src/"
]
